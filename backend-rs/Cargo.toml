[package]
name = "netrix-backend"
version = "0.3.0-beta.13"
edition = "2021"
description = "Netrix terminal manager — Rust backend"

[[bin]]
name = "netrix_backend"
path = "src/main.rs"

[lib]
name = "netrix_backend"
path = "src/lib.rs"

[dependencies]
# ── Web Framework ──
axum = { version = "0.8", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "normalize-path"] }
hyper = { version = "1.6", features = ["full"] }

# ── Async Runtime ──
tokio = { version = "1.44", features = ["full"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["io", "rt"] }
sha2 = "0.10"

# ── Serialization ──
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ── Database ──
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
libsqlite3-sys = "0.30.1"
fs2 = "0.4"
hkdf = "0.12"

# ── SSH ──
russh = "0.65.1"
async-trait = "0.1"

# ── Cryptography (Vault) ──
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
rand_latest = { package = "rand", version = "0.10" }
subtle = "2.6"
zeroize = "1.8"

# ── TLS Inspection ──
rustls = "0.23"
rustls-pki-types = "1.11"
webpki-roots = "0.26"
x509-parser = "0.16"
tokio-rustls = "0.26"

# ── Telnet ──
# We implement a minimal telnet client directly over tokio TCP

# ── Serial ──
tokio-serial = "5.4"

# ── Local shell (PTY) ──
# portable-pty handles ConPTY on Windows and openpty on Unix.
portable-pty = "0.8"

# ── Utilities ──
uuid = { version = "1.20", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
anyhow = "1.0.103"
thiserror = "2.0"
hex = "0.4"
base64 = "0.22"
regex = "1.11"

# ── Platform-specific ──
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }

[build-dependencies]
tauri-winres = "0.3.7"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1

[dev-dependencies]
tokio-tungstenite = "0.29"

[patch.crates-io]
# SQLx 0.8 pins this ABI. Keep its bindings, build the current SQLCipher core.
libsqlite3-sys = { path = "vendor/libsqlite3-sys" }
# Upstream 0.65.1 pins prereleases. The dependency/key-type compatibility patch
# is documented in vendor/russh/NETRIX.md; cryptographic algorithms are unchanged.
russh = { path = "vendor/russh" }
